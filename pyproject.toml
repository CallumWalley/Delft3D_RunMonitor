[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Delft3D_RunMonitor"
version = "0.1.0"
description = "Tools for monitoring and visualising Delft3D simulation runs"
readme = "README.md"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["Delft3D", "monitoring", "mesh", "visualisation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]
requires-python = ">=3.8"
dependencies = [
    "defopt",
    "numpy",
    "scipy",
    "netCDF4",
    "pyvista",
    "vtk",
    "imageio[ffmpeg]",
    "imageio[pyav]",
    "pytest",
    "matplotlib",
    "scikit-learn",
    "shapely",
    #"triangle==20250106",
    "pytriangle",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/yourusername/Delft3D_RunMonitor"
Documentation = "https://github.com/yourusername/Delft3D_RunMonitor/wiki"
Repository = "https://github.com/yourusername/Delft3D_RunMonitor"

[tool.setuptools.packages.find]
where = ["."]
include = ["Delft3D_RunMonitor*"]

[project.scripts]
d3d-plotdod = "Delft3D_RunMonitor.cli.plot_dod:cli"
d3d-movie = "Delft3D_RunMonitor.cli.movie:cli"

[tool.pytest.ini_options]
addopts = ""
testpaths = ["tests"]
filterwarnings = [
    "ignore::pyparsing.warnings.PyparsingDeprecationWarning",
    "ignore:numpy.ndarray size changed:RuntimeWarning",
]

